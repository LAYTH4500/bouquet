<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>a little something</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}

  #panel input[type=text]{width:100%;box-sizing:border-box;background:#1d2136;color:#fff;border:1px solid #2d3352;border-radius:8px;padding:6px 8px;font:inherit}

  #panel .chk{display:flex;gap:12px;flex-wrap:wrap}
  #panel .chk label{display:flex;align-items:center;gap:5px;color:#e8ebff;font-size:13px;margin:0;cursor:pointer}
  #panel.locked>.row,#panel.locked>.act{display:none}

  #panel.locked #p_lock{display:block}

<body>
<canvas id="c"></canvas>
<button id="gear" title="settings" aria-label="settings">⚙</button>
<script>
/* ============ إعدادات سريعة تقدر تعدلها ============ */
const CONFIG = {
  message: "A little something for ya :3",   // الجملة اللي تنكتب تحت
  sparkles: 70,                               // عدد النجوم الصغيرة
  hearts: 22                                  // عدد القلوب الطايرة
};
/* ==================================================== */

/* ---------- الإعدادات (تنحفظ تلقائياً في المتصفح) ---------- */
const DEFAULTS = {shape:'full', mono:false, color:'#ff5a7a', leaf:null, bg:'#05060f',
                  message:CONFIG.message, speed:0.55, hearts:true, sparkles:true, cat:true, seed:7};
let CFG = Object.assign({}, DEFAULTS);
try{ Object.assign(CFG, JSON.parse(localStorage.getItem('bouquetCFG')||'{}')); }catch(e){}
const saveCFG=()=>{ try{ localStorage.setItem('bouquetCFG',JSON.stringify(CFG)); }catch(e){} };
const lumOf=h=>{h=h.replace('#','');return 0.3*parseInt(h.slice(0,2),16)+0.59*parseInt(h.slice(2,4),16)+0.11*parseInt(h.slice(4,6),16);};
let LIGHT=false;
const LMAP={'#ffffff':'#222a44','#f2f2ff':'#222a44','#9be8ff':'#2a8fc8','#7fe3ff':'#2a8fc8','#9fe3ff':'#2a6fb0','#ffe28a':'#d49a00','#ffb3dd':'#e0559a','#ffc2e2':'#e0559a','#b9b0ff':'#6a5acd'};
const adapt=c=>LIGHT&&LMAP[c]?LMAP[c]:c;

const COLS = 70, ROWS = 66;          // حجم الشبكة (حروف)
const CX = 35, RIB = 40;             // مركز الباقة + مكان الشريطة
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const T0 = parseFloat(new URLSearchParams(location.search).get('t') || 0);

let W,H,dpr,cw,chh,fs,ox,oy;
function resize(){
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  chh = Math.min(H/ROWS, W/(COLS*0.6));
  cw = chh*0.6; fs = chh*0.98;
  ox = (W-cw*COLS)/2; oy = (H-chh*ROWS)/2;
}
addEventListener('resize', resize); resize();

/* ---------- أدوات ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(7);
let RB = rng(7);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};

/* ---------- الشاشة (بفر حروف) ---------- */
const CH = new Array(COLS*ROWS), CO = new Array(COLS*ROWS), AL = new Array(COLS*ROWS);
function put(x,y,c,color,a=1,force=true){
  x=Math.round(x); y=Math.round(y);
  if(x<0||y<0||x>=COLS||y>=ROWS) return;
  const i=y*COLS+x;
  if(!force && CH[i] && !(AL[i]<1)) return;
  CH[i]=c; CO[i]=color; AL[i]=a;
}
function text(x,y,s,color,a=1,force=true){ for(let i=0;i<s.length;i++) if(s[i]!==' ') put(x+i,y,s[i],color,a,force); }


const sparkles = Array.from({length:CONFIG.sparkles},()=>({
  x:R()*COLS, y:R()*(ROWS-6), ch:'.+*x\'`°·'[Math.floor(R()*8)],
  col:['#ffffff','#9be8ff','#ffe28a','#ffb3dd','#b9b0ff'][Math.floor(R()*5)],
  sp:0.6+R()*2.2, ph:R()*6.28
}));

const HEART = ['/\\/\\','\\  /',' \\/'];
const particles = [];
function spawn(x,y,burst){
  const k = R();
  particles.push({
    x, y, vy: burst? 6+R()*10 : 2.2+R()*3.2,
    vx: burst? (R()-0.5)*14 : 0,
    ph:R()*6.28, sp:0.6+R()*1.2,
    kind: k<0.45?0 : k<0.7?1 : k<0.88?2 : 3,
    col: ['#ff8ac8','#ffc2e2','#ff6fae','#ffffff','#9be8ff','#ffe28a'][Math.floor(R()*6)],
    life: burst? 1.6+R()*1.4 : 999, burst
  });
}
for(let i=0;i<CONFIG.hearts;i++){ spawn(R()*COLS, R()*ROWS, false); }

let dragging=false,lastX=0,moved=0,userAngle=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;moved=0;});
addEventListener('pointermove',e=>{ if(!dragging) return; const dx=e.clientX-lastX; lastX=e.clientX; moved+=Math.abs(dx); userAngle+=dx*0.01; });
addEventListener('pointerup',e=>{
  if(dragging && moved<6){
    const x=(e.clientX-ox)/cw, y=(e.clientY-oy)/chh;
    for(let i=0;i<14;i++) spawn(x,y,true);
  }
  dragging=false;
});


/* =====================================================================
   باقة ثلاثية الأبعاد تدور على نفسها (z-buffer + إضاءة)
   ===================================================================== */
const D = 120, PIV_Y = 30, TILT = 0.17;
let P0 = [0, 32, 0], DOME_R = 13.5, SY = 1; const A = [0, RIB, 0];
const nrm = v => { const l = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/l,v[1]/l,v[2]/l]; };
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const LT = nrm([-0.5,-0.65,-0.55]);           // اتجاه الضوء (فوق يسار قدام)
const GRAM = ".:-=+*#%@";
const mix = (a,b,t)=>a+(b-a)*t;
const hex = (r,g,b)=>'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
const PALS = {};
function makePal(name,dark,base,light){
  const arr=[];
  for(let i=0;i<12;i++){
    const t=i/11; let c;
    if(t<0.6){ const k=t/0.6; c=[0,1,2].map(j=>mix(dark[j],base[j],k)); }
    else { const k=(t-0.6)/0.4; c=[0,1,2].map(j=>mix(base[j],light[j],k)); }
    arr.push(hex(...c.map(Math.round)));
  }
  PALS[name]=arr;
}
makePal('blue',  [14,30,100],[63,123,255],[140,185,255]);
makePal('cyan',  [8,60,95],  [47,200,255],[150,235,255]);
makePal('pink',  [105,25,65],[255,122,192],[255,185,225]);
makePal('violet',[45,30,105],[138,123,255],[190,180,255]);
makePal('white', [65,65,95], [225,230,255],[255,255,255]);
makePal('gold',  [105,55,0], [255,176,46],[255,240,160]);
makePal('green', [6,48,26],  [47,191,113],[175,255,195]);
makePal('leaf',  [4,36,20],  [31,157,92], [126,231,135]);
const rgbOf=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
function palFromHex(name,h,lift){
  const base=rgbOf(h).map(v=>mix(v,255,lift||0)), lum=0.3*base[0]+0.59*base[1]+0.11*base[2];
  makePal(name, base.map(v=>v*(lum<60?0.3:0.22)), base, base.map(v=>mix(v,255,lum<60?0.5:0.42)));
}
function applyColors(){
  if(CFG.leaf){ palFromHex('leaf',CFG.leaf); palFromHex('green',CFG.leaf,0.12); }
  else { makePal('leaf',[4,36,20],[31,157,92],[126,231,135]); makePal('green',[6,48,26],[47,191,113],[175,255,195]); }
  if(CFG.mono){ palFromHex('mono',CFG.color); palFromHex('ribbon',CFG.color); }
  else makePal('ribbon',[105,25,65],[255,122,192],[255,185,225]);
  LIGHT = lumOf(CFG.bg)>140;
  document.body.style.background=CFG.bg;
}
const colorOf=(p,b)=>PALS[p][Math.min(11,Math.max(0,Math.floor(b*11.99)))];

/* ---- مجموعات النقاط ---- */
function group(c){ return {cx:c[0],cy:c[1],cz:c[2],pts:[]}; }
function pt(G,l,n,d,pal,ch,fixed){ G.pts.push({x:l[0],y:l[1],z:l[2],nx:n[0],ny:n[1],nz:n[2],d,pal,ch,fixed}); }

function frame3(n){
  let u = cross(n,[0,-1,0]); if(Math.hypot(u[0],u[1],u[2])<0.2) u=[1,0,0];
  u = nrm(u); const v = cross(n,u); return [u,v];
}

function makeFlower(c,n,r,type,palName){
  const G = group(c); const [u,v]=frame3(n);
  const ph=RB()*6.28, off=RB()*6.28;
  const at=(rho,a,h)=>{ const ca=Math.cos(a), sa=Math.sin(a);
    return [rho*(ca*u[0]+sa*v[0])+h*n[0], rho*(ca*u[1]+sa*v[1])+h*n[1], rho*(ca*u[2]+sa*v[2])+h*n[2]]; };
  const nor=(a,dh)=>{ const ca=Math.cos(a), sa=Math.sin(a);
    const rad=[ca*u[0]+sa*v[0],ca*u[1]+sa*v[1],ca*u[2]+sa*v[2]];
    return nrm([n[0]-dh*rad[0],n[1]-dh*rad[1],n[2]-dh*rad[2]]); };
  if(type==='rose'){
    for(let rho=0.25; rho<=r*1.15; rho+=0.28){
      const na=Math.max(5,Math.ceil(6.283*rho/0.42));
      for(let k=0;k<na;k++){
        const a=(k+((rho*7)%1))/na*6.283;
        const edge=r*(1+0.13*Math.cos(5*a+ph));
        if(rho>edge) continue;
        const s=rho/edge, LAY=5, lf=s*LAY, layer=Math.floor(lf), f=lf-layer;
        const lobe=0.5+0.5*Math.cos(5*(a-off-layer*2.4));
        const d=(0.55+0.3*lobe-0.4*Math.exp(-f*9)+0.28*f*f*f)*(s>0.9?0.55:1);
        const h=r*0.5*Math.pow(1-s,1.4)-layer*0.12+0.14*lobe;
        const dh=-r*0.7*Math.pow(1-s,0.4)/edge;
        pt(G,at(rho,a,h),nor(a,dh),d,palName);
      }
    }
  } else { // daisy
    const N=10+Math.floor(RB()*4), cr=r*0.28;
    for(let rho=0.2; rho<=cr; rho+=0.26){
      const na=Math.max(4,Math.ceil(6.283*rho/0.4));
      for(let k=0;k<na;k++){
        const a=(k+((rho*5)%1))/na*6.283, s=rho/cr;
        const h=r*0.28*(1-s*s)+0.2, dh=-r*0.56*s/cr;
        pt(G,at(rho,a,h),nor(a,dh),0.65+0.35*RB(),'gold',((k+Math.round(rho*4))&1)?'@':'0');
      }
    }
    for(let rho=cr*0.9; rho<=r; rho+=0.28){
      const na=Math.max(6,Math.ceil(6.283*rho/0.42));
      for(let k=0;k<na;k++){
        const a=(k+((rho*7)%1))/na*6.283;
        const pet=Math.abs(Math.cos(N*(a-off)/2));
        const s=(rho-cr)/(r-cr);
        if(s>0.35+0.65*Math.pow(pet,0.5)) continue;
        const d=0.45+0.4*pet+0.25*s-0.25*(1-pet);
        const h=0.06*r-0.18*r*s*s, dh=-0.36*r*s/(r-cr);
        pt(G,at(rho,a,h),nor(a,dh),d,palName);
      }
    }
  }
  return G;
}

function makeLeaf(psi,elev,len,wid){
  const base=[Math.cos(psi)*1.2, 38, Math.sin(psi)*1.2];
  const G=group(base);
  const d=nrm([Math.cos(psi)*Math.cos(elev), -Math.sin(elev), Math.sin(psi)*Math.cos(elev)]);
  const side=nrm(cross(d,[0,1,0]));
  let nn=nrm(cross(side,d)); if(nn[1]>0) nn=[-nn[0],-nn[1],-nn[2]];
  for(let u=0.03; u<=1; u+=0.03){
    const w=wid*Math.pow(Math.sin(Math.PI*Math.pow(u,0.8)),0.9);
    const cnt=Math.max(1,Math.ceil(2*w/0.32));
    for(let k=0;k<=cnt;k++){
      const vv=cnt?(k/cnt*2-1):0;
      const lx=d[0]*len*u+side[0]*vv*w, ly=d[1]*len*u+side[1]*vv*w+0.22*len*u*u, lz=d[2]*len*u+side[2]*vv*w;
      const mid=Math.abs(vv)<0.12;
      const det=0.5+0.22*Math.abs(vv)+0.08*Math.sin(u*40+Math.abs(vv)*6)+(mid?0.18:0);
      pt(G,[lx,ly,lz],nn,det,'leaf');
    }
  }
  return G;
}

/* ---- بناء المشهد (يُعاد بناؤه عند تغيير الإعدادات) ---- */
const FL=[], GROUPS=[];
const SHAPES={
  full :{N:19,phi:76,R:13.5,sy:1,   py:32,rmin:3.4,rr:0.9,leaves:9,llen:13,lwid:2.7,fol:700,baby:170},
  dense:{N:32,phi:84,R:14.5,sy:1,   py:32,rmin:3.7,rr:0.9,leaves:9,llen:13,lwid:2.7,fol:900,baby:200},
  tall :{N:24,phi:74,R:13,  sy:1.55,py:33,rmin:3.1,rr:0.8,leaves:9,llen:13,lwid:2.7,fol:800,baby:180},
  short:{N:12,phi:80,R:12.5,sy:0.62,py:35,rmin:3.5,rr:0.8,leaves:8,llen:12,lwid:2.6,fol:350,baby:90},
  single:{single:true}
};
function buildScene(){
  RB=rng(CFG.seed); FL.length=0; GROUPS.length=0;
  const S0=SHAPES[CFG.shape]||SHAPES.full, single=!!S0.single, bs=single?0.5:1;
  const kinds=CFG.mono
    ? [['rose','mono'],['rose','mono'],['daisy','mono']]
    : [['rose','blue'],['rose','cyan'],['rose','pink'],['rose','violet'],['daisy','white'],['daisy','pink'],['daisy','cyan'],['rose','blue'],['rose','cyan']];
  if(single){
    const n=nrm([0,-0.82,-0.57]), c=[0,23,0], r=8.8;
    const G=makeFlower(c,n,r,'rose',CFG.mono?'mono':'pink');
    G.t0=1.2; G.kind='flower'; G.c=c; G.n=n; G.r=r; G.i=0; FL.push(G); GROUPS.push(G);
    for(let k=0;k<3;k++){
      const L=makeLeaf(k*2.094+0.6+RB()*0.4, 0.1+RB()*0.2, 8.5+RB()*2, 2.0+RB()*0.5);
      L.t0=0.6+k*0.12; L.kind='leaf'; GROUPS.push(L);
    }
  } else {
    P0=[0,S0.py,0]; DOME_R=S0.R; SY=S0.sy;
    const N=S0.N, PHI=S0.phi*Math.PI/180;
    for(let i=0;i<N;i++){
      const cosP=1-(1-Math.cos(PHI))*(i+0.5)/N;
      const phi=Math.acos(cosP), psi=i*2.399963;
      const dir=[Math.sin(phi)*Math.cos(psi), -cosP, Math.sin(phi)*Math.sin(psi)];
      const c=[P0[0]+DOME_R*dir[0], P0[1]+DOME_R*dir[1]*SY, P0[2]+DOME_R*dir[2]];
      const n=nrm([dir[0]+(RB()-0.5)*0.25, dir[1]/SY+(RB()-0.5)*0.25, dir[2]+(RB()-0.5)*0.25]);
      const r=S0.rmin+RB()*S0.rr+(1-phi/PHI)*0.4;
      const kd=kinds[Math.floor(RB()*kinds.length)];
      const G=makeFlower(c,n,r,kd[0],kd[1]);
      G.t0=1.7+i*Math.min(0.11,2.1/N); G.kind='flower'; G.c=c; G.n=n; G.r=r; G.i=i;
      FL.push(G); GROUPS.push(G);
    }
    for(let k=0;k<S0.leaves;k++){
      const G=makeLeaf(k*6.283/S0.leaves+RB()*0.4, 0.02+RB()*0.3, S0.llen+RB()*4, S0.lwid+RB()*0.9);
      G.t0=0.9+k*0.08; G.kind='leaf'; GROUPS.push(G);
    }
    const F=group(P0); F.kind='foliage'; F.t0=1.2;
    const fch='"^`\'';
    for(let k=0;k<S0.fol;k++){
      const cosP=1-RB()*(1-Math.cos(1.5)), phi=Math.acos(cosP), psi=RB()*6.283;
      const dir=[Math.sin(phi)*Math.cos(psi), -cosP, Math.sin(phi)*Math.sin(psi)], rr=DOME_R-2.2+RB()*1.2;
      pt(F,[dir[0]*rr,dir[1]*rr*SY,dir[2]*rr],dir,0.35+RB()*0.4,'leaf',fch[Math.floor(RB()*4)]);
    }
    GROUPS.push(F);
    const B=group(P0); B.kind='baby'; B.t0=3.0;
    for(let k=0;k<S0.baby;k++){
      const cosP=1-RB()*(1-Math.cos(1.55)), phi=Math.acos(cosP), psi=RB()*6.283;
      const dir=[Math.sin(phi)*Math.cos(psi), -cosP, Math.sin(phi)*Math.sin(psi)], rr=DOME_R+1.2+RB()*3.5;
      pt(B,[dir[0]*rr,dir[1]*rr*SY,dir[2]*rr],dir,0.7+RB()*0.3,CFG.mono?'mono':(RB()<0.7?'white':'pink'),'o.\''[Math.floor(RB()*3)],true);
    }
    GROUPS.push(B);
  }
  // الجزء اللي تحت الشريطة + الشريطة
  const S=group(A); S.kind='base'; S.t0=0;
  for(let y=0;y<=9;y+=0.3){
    const rad=(2.0-0.09*y)*bs, na=Math.max(4,Math.ceil(6.283*rad/0.4));
    for(let k=0;k<na;k++){
      const a=k/na*6.283, nx=Math.cos(a), nz=Math.sin(a);
      pt(S,[nx*rad,y+1,nz*rad],[nx,0,nz],0.55+0.2*Math.sin(a*3+y),'green');
    }
  }
  for(const yy of [-0.3,0.7]) for(let k=0;k<64;k++){
    const a=k/64*6.283, nx=Math.cos(a), nz=Math.sin(a);
    pt(S,[nx*2.4*bs,yy,nz*2.4*bs],[nx,0,nz],0.62+0.2*Math.sin(a*2),'ribbon',(k&1)?'=':'%');
  }
  const loop=(sx)=>{ for(let k=0;k<44;k++){ const a=k/44*6.283;
      pt(S,[sx*(2.4+Math.cos(a)*2.0)*bs, 0.2+Math.sin(a)*1.1*bs, -2.5*bs],[0,0,-1],0.8,'ribbon',(k&1)?'#':'%',true); } };
  loop(1); loop(-1);
  for(const sx of [-1,1]) for(let y=0.6;y<=6;y+=0.4){
    pt(S,[sx*(0.8+y*0.28)*bs, y+0.4, (-2.6+Math.sin(y)*0.2)*bs],[0,0,-1],0.75,'ribbon','|',true);
  }
  GROUPS.push(S);
}

/* ---- التحويل والعرض ---- */
const zbuf=new Float32Array(COLS*ROWS);
let cT,sT,cP,sP,rx,ry,rz,bob=0;
function rot(x,y,z){
  const x1=x*cT+z*sT, z1=-x*sT+z*cT;
  rx=x1; ry=y*cP-z1*sP; rz=y*sP+z1*cP;
}
function splatAt(x,y,z,ch,col,a){
  const s=D/(D+z), sx=Math.round(CX+x*s/0.6), sy=Math.round(PIV_Y+bob+y*s);
  if(sx<0||sy<0||sx>=COLS||sy>=ROWS) return;
  const i=sy*COLS+sx; if(z<zbuf[i]){ zbuf[i]=z; CH[i]=ch; CO[i]=col; AL[i]=a; }
}
const ease=x=>x<=0?0:x>=1?1:easeOutBack(x);

function drawGroup(G,g,tint){
  if(g<=0) return;
  const cx=G.cx, cy=G.cy-PIV_Y, cz=G.cz;
  for(const p of G.pts){
    rot(cx+g*p.x, cy+g*p.y, cz+g*p.z);
    const px=rx,py=ry,pz=rz;
    rot(p.nx,p.ny,p.nz);
    const lam=Math.max(0,rx*LT[0]+ry*LT[1]+rz*LT[2]);
    let b=p.fixed? p.d : Math.min(1,p.d*(0.32+0.85*lam)+0.1*lam*lam*lam*lam);
    const ch = p.ch || GRAM[Math.min(8,Math.floor(b*8.99))];
    splatAt(px,py,pz,ch,colorOf(p.pal,b),1);
  }
}

function drawStems(t){
  for(const F of FL){
    const g=clamp((t-0.2-F.i*0.05)/1.2,0,1); if(g<=0) continue;
    const S=[F.c[0]-F.n[0]*1.2, F.c[1]-F.n[1]*1.2, F.c[2]-F.n[2]*1.2];
    const K=[(A[0]+S[0])/2+Math.sin(F.i*2.1)*1.2, (A[1]+S[1])/2+2, (A[2]+S[2])/2+Math.cos(F.i*1.7)*1.2];
    const N=28; let psx=0,psy=0,have=false;
    for(let k=0;k<=N;k++){
      const u=k/N*g, w=1-u;
      const x=w*w*A[0]+2*w*u*K[0]+u*u*S[0], y=w*w*A[1]+2*w*u*K[1]+u*u*S[1]-PIV_Y, z=w*w*A[2]+2*w*u*K[2]+u*u*S[2];
      rot(x,y,z);
      const sc=D/(D+rz), sx=CX+rx*sc/0.6, sy=PIV_Y+bob+ry*sc;
      if(have){
        const dx=(sx-psx)*0.6, dy=sy-psy;
        const ch=Math.abs(dx)<0.4*Math.abs(dy)?((k&1)?'|':':'):(dx*dy>0?'\\':'/');
        splatAt(rx,ry,rz,ch,colorOf('green',0.45+0.15*((k+F.i)&1)),1);
      }
      psx=sx;psy=sy;have=true;
    }
  }
}

function drawBouquet(t,theta){
  cT=Math.cos(theta); sT=Math.sin(theta); cP=Math.cos(TILT); sP=Math.sin(TILT);
  bob=Math.sin(t*1.4)*0.25;
  zbuf.fill(Infinity);
  drawStems(t);
  for(const G of GROUPS){
    let g=1;
    if(G.kind==='flower') g=ease((t-G.t0)/1.2);
    else if(G.kind==='leaf') g=ease((t-G.t0)/1.1);
    else if(G.kind==='foliage') g=clamp((t-G.t0)/1.2,0,1);
    else if(G.kind==='baby') g=clamp((t-G.t0)/1.0,0,1);
    else if(G.kind==='base') g=clamp(t/0.6,0,1);
    drawGroup(G,g);
  }
}

const CAT = [
  "     /\\_/\\     ",
  " ((  ( OwO )  ))",
  "    /(  <3  )\\  ",
  "     (_) (_)    "
];
function drawCat(t){
  if(t<0.6||!CFG.cat||catMode) return;
  const by = 49 + Math.round(Math.sin(t*2.2)*0.5);
  const blink = (t%3.4)>3.25;
  const wig = Math.sin(t*5)>0;
  for(let i=0;i<CAT.length;i++){
    let line = CAT[i];
    if(i===1){
      if(blink) line=line.replace('OwO','-w-');
      if(wig) line=line.replace('((','( ').replace('))',' )');
    }
    const x0 = CX-Math.floor(line.length/2);
    for(let k=0;k<line.length;k++){
      const c=line[k]; if(c===' ') continue;
      let col=adapt('#f2f2ff');
      if('Ow-'.includes(c) && i===1 && k>=6 && k<=10) col=adapt('#7fe3ff');
      if(c==='<'||c==='3') col = (i===2)?'#ff7ac0':col;
      put(x0+k,by+i,c,col);
    }
  }
}

function drawSparkles(t){
  if(!CFG.sparkles) return;
  for(const s of sparkles){
    const v=Math.sin(t*s.sp+s.ph);
    if(v>0.15) put(s.x,s.y,s.ch,adapt(s.col),0.35+0.65*v,false);
  }
}

function drawParticles(t,dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.y -= p.vy*dt;
    p.x += (p.burst? p.vx*dt : Math.sin(t*p.sp+p.ph)*0.05);
    if(p.burst){ p.life-=dt; p.vy*=0.985; if(p.life<=0||p.y<-4){particles.splice(i,1);continue;} }
    else if(p.y<-4){ p.y=ROWS+2; p.x=R()*COLS; }
    let a = p.burst ? clamp(p.life,0,1) : clamp(p.y/10,0,1)*clamp((ROWS-p.y)/8,0,1);
    if(a<=0.02) continue;
    if(!p.burst && !CFG.hearts) continue;
    switch(p.kind){
      case 0: text(p.x,p.y,'<3',adapt(p.col),a,false); break;
      case 1: HEART.forEach((l,k)=>text(p.x,p.y+k,l,adapt(p.col),a,false)); break;
      case 2: put(p.x,p.y,'*',adapt(p.col),a,false); break;
      default: text(p.x,p.y,'(@)',adapt(p.col),a,false);
    }
  }
}

let msgStart=5.2;
let catMode=false;
const AR=/[\u0600-\u06FF]/;
function drawMessage(t){
  const m=CFG.message; if(!m||t<msgStart||AR.test(m)) return;
  const n=Math.min(m.length, Math.floor((t-msgStart)*14));
  const x0=CX-Math.floor(m.length/2), col=adapt('#9fe3ff');
  text(x0,61,m.slice(0,n),col);
  if(n<m.length || Math.floor(t*2)%2===0) put(x0+n,61,'_',col);
}
function drawArabic(t){      // العربي يُرسم كسطر كامل عشان يتشبّك صح
  const m=CFG.message; if(!m||t<msgStart||!AR.test(m)) return;
  const s=m.slice(0,Math.min(m.length,Math.floor((t-msgStart)*14))); if(!s) return;
  ctx.globalAlpha=1; ctx.fillStyle=adapt('#9fe3ff'); ctx.direction='rtl';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.font=`bold ${fs*1.3}px Tahoma,"Segoe UI",Arial,sans-serif`;
  ctx.fillText(s, ox+cw*COLS/2, oy+chh*60.4);
  ctx.direction='ltr';
}

const CAT_S=0.056;
let CATM=null;
function loadCatModel(){
  if(CATM) return;
  const bin=atob(CAT_B64), n=bin.length/12, u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const dv=new DataView(u.buffer);
  CATM={n,X:new Float32Array(n),Y:new Float32Array(n),Z:new Float32Array(n),
       NX:new Float32Array(n),NY:new Float32Array(n),NZ:new Float32Array(n),
       R:new Uint8Array(n),G:new Uint8Array(n),B:new Uint8Array(n)};
  for(let i=0;i<n;i++){
    const o=i*12;
    CATM.X[i]=dv.getInt16(o,true)*CAT_S;
    CATM.Y[i]=dv.getInt16(o+2,true)*CAT_S+1;
    CATM.Z[i]=(dv.getInt16(o+4,true)-100)*CAT_S;
    CATM.NX[i]=dv.getInt8(o+6)/127; CATM.NY[i]=dv.getInt8(o+7)/127; CATM.NZ[i]=dv.getInt8(o+8)/127;
    CATM.R[i]=u[o+9]; CATM.G[i]=u[o+10]; CATM.B[i]=u[o+11];
  }
}
const HEXC=new Array(32768);
const hexRGB=(r,g,b)=>{ const k=((r>>3)<<10)|((g>>3)<<5)|(b>>3); return HEXC[k]||(HEXC[k]=hex(r,g,b)); };
function drawCatModel(t,theta){
  loadCatModel();
  cT=Math.cos(theta); sT=Math.sin(theta); cP=Math.cos(TILT); sP=Math.sin(TILT);
  bob=Math.sin(t*1.4)*0.2;
  zbuf.fill(Infinity);
  const g=ease(t/1.1); if(g<=0) return;
  for(let i=0;i<CATM.n;i++){
    rot(g*CATM.X[i], g*CATM.Y[i], g*CATM.Z[i]);
    const px=rx,py=ry,pz=rz;
    rot(CATM.NX[i],CATM.NY[i],CATM.NZ[i]);
    const lam=Math.max(0,rx*LT[0]+ry*LT[1]+rz*LT[2]);
    const f=0.55+0.75*lam;
    const r=(255*Math.pow(Math.min(1,CATM.R[i]*f/255),0.58))|0,
          gg=(255*Math.pow(Math.min(1,CATM.G[i]*f/255),0.58))|0,
          b=(255*Math.pow(Math.min(1,CATM.B[i]*f/255),0.58))|0;
    const lum=Math.min(1,Math.max(0,((0.3*r+0.59*gg+0.11*b)/255-0.30)/0.45));
    const ch=GRAM[Math.min(8,Math.floor(lum*8.99))];
    splatAt(px,py,pz,ch,hexRGB(r,gg,b),1);
  }
}

/* ---------- الحلقة الرئيسية ---------- */
let last=performance.now(), start=last, rotPhase=T0*0.55, sceneStart=0, curT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const t=(now-start)/1000+T0; curT=t;
  CH.fill(null);

  drawSparkles(t);
  rotPhase+=dt*CFG.speed;
  if(catMode) drawCatModel(t-sceneStart, userAngle+rotPhase); else drawBouquet(t-sceneStart, userAngle+rotPhase);
  drawCat(t);
  drawParticles(t,dt);
  drawMessage(t);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha=1; ctx.fillStyle=CFG.bg; ctx.fillRect(0,0,W,H);
  ctx.font=`bold ${fs}px "Courier New", Consolas, Menlo, monospace`;
  ctx.textAlign='center'; ctx.textBaseline='top';
  let lastCol=null;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const i=y*COLS+x, c=CH[i]; if(!c) continue;
    if(CO[i]!==lastCol){ ctx.fillStyle=CO[i]; lastCol=CO[i]; }
    ctx.globalAlpha=AL[i];
    ctx.fillText(c, ox+x*cw+cw/2, oy+y*chh);
  }
  drawArabic(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

    mark($('p_leaf'),k=>CFG.leaf?k===CFG.leaf:k==='multi');
    mark($('p_bg'),k=>k===CFG.bg);
    $('p_flower').querySelector('input').value=CFG.color;
    $('p_leaf').querySelector('input').value=CFG.leaf||'#2fbf71';
    $('p_bg').querySelector('input').value=CFG.bg;
    $('p_msg').value=CFG.message; $('p_speed').value=CFG.speed;
    for(const k of ['hearts','sparkles','cat']) $('p_'+k).checked=!!CFG[k];
  }
  refresh();
})();
</script>
</body>
</html>
